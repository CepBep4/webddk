<div id="accessibility-panel" style="width:100%;background:#232526;color:#fff;display:flex;align-items:center;justify-content:center;gap:24px;padding:8px 0 6px 0;z-index:10000;box-shadow:0 2px 8px #0002;">
    <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:1em;">Размер шрифта:</span>
        <button class="font-size-btn font-size-minus" style="font-size:1.2em;padding:2px 10px;border-radius:4px;border:none;cursor:pointer;">-</button>
        <span class="font-size-value" style="min-width:32px;display:inline-block;text-align:center;font-size:1.2em;font-weight:bold;">20</span>
        <button class="font-size-btn font-size-plus" style="font-size:1.2em;padding:2px 10px;border-radius:4px;border:none;cursor:pointer;">+</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:1em;">Цвет:</span>
        <button class="color-scheme-btn" data-scheme="blackwhite" style="background:#fff;color:#111;width:24px;height:24px;border-radius:4px;border:2px solid #888;cursor:pointer;"></button>
        <button class="color-scheme-btn" data-scheme="whiteblack" style="background:#111;color:#fff;width:24px;height:24px;border-radius:4px;border:2px solid #888;cursor:pointer;"></button>
        <button class="color-scheme-btn" data-scheme="blue" style="background:#e3f0ff;color:#002b5c;width:24px;height:24px;border-radius:4px;border:2px solid #888;cursor:pointer;"></button>
        <button class="color-scheme-btn" data-scheme="brown" style="background:#f7f3d6;color:#4d4b43;width:24px;height:24px;border-radius:4px;border:2px solid #888;cursor:pointer;"></button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:1em;">Масштаб:</span>
        <button class="zoom-btn zoom-minus" style="font-size:1.2em;padding:2px 10px;border-radius:4px;border:none;cursor:pointer;">-</button>
        <span class="zoom-value" style="min-width:40px;display:inline-block;text-align:center;font-size:1.2em;font-weight:bold;">100%</span>
        <button class="zoom-btn zoom-plus" style="font-size:1.2em;padding:2px 10px;border-radius:4px;border:none;cursor:pointer;">+</button>
    </div>
</div>
