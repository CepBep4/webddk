<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <title>О компании — Админ</title>
</head>
<body class="admin-body">
    {% include 'admin/nav.html' %}
    <div class="admin-content">
        <h1 class="admin-page-title">О компании</h1>
        <p class="admin-hint">Можно использовать HTML-теги: &lt;p&gt;, &lt;strong&gt;, &lt;br&gt;, &lt;ul&gt;, &lt;li&gt;.</p>
        <form method="post" action="{{ url_for('admin_about') }}" class="admin-form">
            <textarea name="about" rows="25" class="admin-textarea">{{ about }}</textarea>
            <div class="admin-form-actions">
                <button type="submit" class="admin-btn">Сохранить</button>
                <a href="{{ url_for('admin_dashboard') }}" class="admin-btn admin-btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
